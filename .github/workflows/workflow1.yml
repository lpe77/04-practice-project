name: Lint, test, deploy on push
on: push
jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: action/checkout@v3
      - name: Install NodeJS
        uses: action/setup-node@v3
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: slint --ext .jsx --fix src
        
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Run test
        run: vitest run

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Run build
        run: vite build
