name: Lint, test, deploy on push
on: push
jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Run lint
        run: eslint --ext .jsx --fix src
        
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Run test
        run: vitest run

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Run build
        run: vite build
